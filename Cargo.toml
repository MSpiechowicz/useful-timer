[package]
name = "useful-timer"
version = "1.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
description = "Independent animated desktop countdown widgets"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "persistence"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
ron = "0.12.2"
serde = { version = "1", features = ["derive"] }
semver = "1"
serde_json = "1"
tempfile = "3"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["x11"] }
