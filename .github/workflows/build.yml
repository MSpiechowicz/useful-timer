name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Node.js for release tooling checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.10.0'

      - name: Check release stamping and artifact checksums
        run: node --test .github/release/cargo.test.mjs

      - name: Exercise Unix installers against local releases
        if: runner.os != 'Windows'
        run: python3 .github/tests/installers.py

      - name: Exercise Windows installer with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: .github/tests/installers.ps1

      - name: Exercise Windows installer with PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/tests/installers.ps1

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libgl-dev

      - name: Install Rust 1.95.0 and tools
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --locked

      - name: Run deterministic tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build release binary
        run: cargo build --release --locked
